[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunt"
version = "0.1.0"
description = "Local-first job search planning tools"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
job-hunt = "job_hunt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
